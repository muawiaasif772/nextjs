name: Next.js CI/CD

on:
  push:
    branches:
      - nextjs
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run tests (if you have any)
      - name: Run tests
        run: npm test

      # 5. Build your Next.js project
      - name: Build Next.js project
        run: npm run build
